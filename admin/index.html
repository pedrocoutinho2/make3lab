<style>
:root{
  --prussia-950:#061620;--prussia-900:#0C2130;--prussia-800:#12303F;--prussia-700:#1B4256;
  --azul-100:#C6E7FB;--azul-300:#5EBAF3;--azul-400:#25A1EF;--azul-500:#1087D1;--azul-600:#0C68A1;--azul-700:#094972;
  --aco-600:#41627A;--aco-500:#6B7F8E;--aco-400:#8FA3B0;--nevoa-200:#D8E4EC;--nevoa-100:#EBF1F5;--papel:#F7FAFC;
  --ok:#2E9E6B;--atencao:#F2C200;--erro:#E05555;
  --fundo:var(--prussia-950);--carta:var(--prussia-900);--carta2:var(--prussia-800);--linha:var(--prussia-700);
  --tinta:var(--nevoa-100);--fraca:var(--aco-400);--muda:var(--aco-500);--marca:var(--azul-400);--ativo:var(--azul-300);
  --t:'Archivo',system-ui,sans-serif;--d:'IBM Plex Mono',ui-monospace,monospace;--r:4px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fundo);color:var(--tinta);font:400 14px/1.55 var(--t)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--ativo)}
:focus-visible{outline:2px solid var(--marca);outline-offset:2px}
.n,.mono{font-family:var(--d);font-variant-numeric:tabular-nums}
header.topo{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--carta);border-bottom:1px solid var(--linha)}
header.topo b.marca{font:800 15px var(--t);font-variation-settings:'wdth' 84;letter-spacing:.02em;text-transform:uppercase}
header.topo .sel{font:600 11px var(--t);text-transform:uppercase;letter-spacing:.08em;color:var(--atencao);border:1px solid color-mix(in srgb,var(--atencao) 55%,transparent);padding:2px 6px;border-radius:999px}
.esp{flex:1}
nav.abas{display:flex;gap:4px;overflow-x:auto;padding:10px 16px 0;border-bottom:1px solid var(--linha);background:var(--carta);scrollbar-width:thin;position:sticky;top:49px;z-index:4}
nav.abas button{background:none;border:0;border-bottom:2px solid transparent;padding:8px 12px;color:var(--fraca);cursor:pointer;white-space:nowrap;font-weight:600}
nav.abas button.on{color:var(--tinta);border-color:var(--marca)}
nav.abas .cont{font:500 11px var(--d);margin-left:6px;padding:1px 6px;border-radius:999px;background:var(--carta2);color:var(--fraca)}
nav.abas .cont.alerta{background:color-mix(in srgb,var(--erro) 22%,transparent);color:var(--nevoa-100)}
main{max-width:1240px;margin:0 auto;padding:18px 16px 60px}
h1{font:700 26px/1.1 var(--t);font-variation-settings:'wdth' 92;margin:0 0 4px}
h2{font:600 18px var(--t);margin:0}
h3{font:600 15px var(--t);margin:14px 0 8px}
.eyebrow{font:600 12px var(--t);text-transform:uppercase;letter-spacing:.08em;color:var(--azul-300)}
.sub{color:var(--fraca);font-size:13px}
.cartao{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);padding:16px;margin-bottom:14px;min-width:0}
.cab{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr));margin-bottom:14px}
.kpi{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);padding:12px 14px;min-width:0;text-align:left;cursor:pointer}
.kpi .rot{font-size:12px;color:var(--fraca);display:block}
.kpi b{font:500 24px var(--d);white-space:nowrap;display:block;margin:2px 0}
.kpi b.ruim{color:var(--erro)} .kpi b.at{color:var(--atencao)}
.bt{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--linha);background:var(--carta2);color:var(--tinta);padding:8px 13px;border-radius:var(--r);font-weight:600;font-size:13px;cursor:pointer;text-decoration:none;white-space:nowrap}
.bt:hover{border-color:var(--aco-600)} .bt:disabled{opacity:.5;cursor:not-allowed}
.bt.forte{background:var(--marca);border-color:var(--marca);color:#04121A}
.bt.mini{padding:5px 9px;font-size:12px}
.bt.perigo{border-color:var(--erro);color:var(--erro)}
.linha-bt{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
label{display:block;font-weight:500;margin-bottom:4px;font-size:13px}
input,select,textarea{width:100%;background:var(--prussia-950);border:1px solid var(--linha);border-radius:var(--r);padding:8px 10px;min-width:0}
textarea{resize:vertical}
@media (max-width:1023px){input,select,textarea{font-size:16px}}
.campos{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(170px,100%),1fr))}
.lista{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.item{border:1px solid var(--linha);border-radius:var(--r);padding:10px 12px;background:var(--fundo);min-width:0}
.item.click{cursor:pointer} .item.click:hover{border-color:var(--aco-600)}
.l1{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.l1 b{overflow-wrap:anywhere}
.pil{display:inline-block;font:600 11px var(--t);text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:999px;border:1px solid var(--linha);color:var(--fraca);white-space:nowrap}
.pil.ok{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 60%,transparent)}
.pil.at{color:var(--atencao);border-color:color-mix(in srgb,var(--atencao) 60%,transparent)}
.pil.ruim{color:var(--erro);border-color:color-mix(in srgb,var(--erro) 60%,transparent)}
.pil.az{color:var(--azul-300);border-color:color-mix(in srgb,var(--azul-400) 60%,transparent)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.filtros{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.filtros>div{min-width:150px;flex:1 1 150px;max-width:240px}
.vazio{padding:18px;text-align:center;color:var(--fraca);border:1px dashed var(--linha);border-radius:var(--r)}
.aviso{border:1px solid var(--linha);border-left:3px solid var(--marca);background:var(--carta2);padding:10px 12px;border-radius:var(--r);margin-bottom:12px}
.aviso.ruim{border-left-color:var(--erro)} .aviso.at{border-left-color:var(--atencao)} .aviso.ok{border-left-color:var(--ok)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere}
.call{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:start}
.call .num{font:600 13px var(--d);color:var(--fraca);padding-top:2px}
details>summary{cursor:pointer;color:var(--ativo);font-weight:600;margin:6px 0}
.modal-fundo{position:fixed;inset:0;background:rgba(2,8,12,.72);z-index:20;display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;overflow-y:auto}
.modal{background:var(--carta);border:1px solid var(--linha);border-radius:var(--r);padding:18px;width:min(980px,100%);min-width:0}
.modal .cab h2{font-size:20px}
.dois{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(360px,100%),1fr))}
.pend{color:var(--atencao)} .feito{color:var(--ok)}
.entrar{max-width:380px;margin:12vh auto;padding:0 16px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--carta2);border:1px solid var(--linha);padding:10px 14px;border-radius:var(--r);z-index:30;max-width:calc(100% - 32px)}
table{width:100%;border-collapse:collapse}
@media (max-width:640px){
  main{padding:14px 12px 60px}
  .cartao{padding:12px}
  .modal{padding:14px}
  h1{font-size:22px}
  .linha-bt .bt{flex:1 1 auto;justify-content:center}
}
</style>
</head>
<body>
<div id="raiz"></div>
<script>
'use strict';
const sb = supabase.createClient(M3_CONFIG.supabaseUrl, M3_CONFIG.supabaseKey, { auth: { persistSession: true, storageKey: 'm3-admin' } });
const $ = (s, el = document) => el.querySelector(s);
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const brl = (n) => (Number(n) || 0).toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
const dt = (iso) => iso ? new Date(iso).toLocaleDateString('pt-BR', { timeZone: 'America/Sao_Paulo' }) : '';
const dth = (iso) => iso ? new Date(iso).toLocaleString('pt-BR', { timeZone: 'America/Sao_Paulo', day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }).replace(',', '') : '';
const dBr = (ymd) => ymd ? ymd.split('-').reverse().join('/') : '';
const hojeYmd = () => new Date(Date.now() - 3 * 3600e3).toISOString().slice(0, 10);
const horas = (iso) => (Date.now() - new Date(iso).getTime()) / 3600e3;
const paraLocal = (iso) => { if (!iso) return ''; const d = new Date(new Date(iso).getTime() - 3 * 3600e3); return d.toISOString().slice(0, 16); };
const deLocal = (v) => v ? new Date(v + ':00-03:00').toISOString() : '';
function toast(t) { const el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 3200); }

const ST_LEAD = { novo: ['Novo', 'az'], contatado: ['Contatado', 'at'], convidado: ['Convidado', 'at'], convertido: ['Founder', 'ok'], descartado: ['Não selecionado', ''] };
const ST_CH = { aberto: ['Aberto', 'ruim'], em_andamento: ['Em andamento', 'at'], respondido: ['Respondido', 'ok'], fechado: ['Fechado', ''] };
const CAT_CH = { duvida: 'Dúvida', erro: 'Erro', sugestao: 'Sugestão', conta: 'Conta e plano' };
const ST_CALL = { a_agendar: ['A agendar', 'at'], agendada: ['Agendada', 'az'], feita: ['Feita', 'ok'], remarcar: ['Remarcar', 'at'], faltou: ['Faltou', 'ruim'], cancelada: ['Cancelada', ''] };
const TIPO_CALL = { entrada: 'Call de entrada', quinzenal: 'Quinzenal', mensal: 'Mensal', extra: 'Extra' };
const TIPO_FB = { dor: 'Dor', pedido: 'Pedido', bug: 'Bug', elogio: 'Elogio', duvida: 'Dúvida' };
const ST_FB = { novo: ['Novo', 'az'], backlog: ['Backlog', 'at'], feito: ['Feito', 'ok'], descartado: ['Descartado', ''] };
const PRIO = { alta: ['Alta', 'ruim'], media: ['Média', 'at'], baixa: ['Baixa', ''] };
const PASSOS = [['empresa', 'Loja'], ['impressoras', 'Impressoras'], ['custos', 'Custos'], ['preco', 'Margem e refugo'], ['impostos', 'Impostos'], ['canais', 'Canais']];
const pil = (m, k) => { const x = m[k] || [k, '']; return `<span class="pil ${x[1]}">${esc(x[0])}</span>`; };

/* roteiro que entra nas notas da call com um clique */
const ROTEIRO = {
  entrada: `CALL DE ENTRADA · 30 min
1. Abertura (2 min): agradecer, explicar o formato (entrada, quinzenais até o mês 3, mensais nos meses 4 e 5) e que o objetivo é o preço dele bater com a conta real.
2. A operação dele (8 min)
- Impressoras e modelos:
- O que vende e onde vende:
- Como precifica hoje (planilha, chute, outro sistema):
- Maior dor hoje:
3. Configuração juntos, com a tela dele compartilhada (15 min)
- Loja, impressoras com valor pago, custos (conta de luz dele, hora), margem e refugo, regime, canais, 1 filamento
- Precificar 1 produto que ele já vende. Preço atual: R$ ____ · Preço do sistema: R$ ____
4. Próximos passos (5 min)
- Meta até a próxima: cadastrar 5 produtos e mandar 3 orçamentos pelo sistema
- Suporte: chamado no app com resposta em até 24 h, WhatsApp para urgência
- Importador de 3MF em beta: se vier número estranho, abrir chamado com o arquivo
- Data da próxima call:`,
  quinzenal: `QUINZENAL · 15 a 20 min
1. O que usou desde a última (3 min):
2. Onde travou (5 min). Cada trava vira feedback do tipo bug ou dor:
3. O que fez falta (5 min). Cada um vira pedido:
4. Um número (3 min): algum preço mudou depois do sistema? De quanto para quanto?
5. Meta até a próxima (2 min):`,
  mensal: `MENSAL · 20 min
1. Uso real: orçamentos e vendas registrados no mês (abrir o painel antes da call):
2. O que mudou na operação desde a entrada:
3. Se o Make3Lab sumisse amanhã: muito decepcionado, um pouco ou nada?
4. O que faria ele indicar para outro operador:
5. Confirmar a passagem para R$ 19,90 depois do grátis e a forma de cobrança:`,
  extra: `CALL EXTRA
Motivo:
O que ficou combinado:`,
};

let S = { aba: 'geral', dados: null, aberta: null, filtro: {} };

async function iniciar() {
  const { data } = await sb.auth.getSession();
  if (!data.session) return telaEntrar();
  const { data: ok, error } = await sb.rpc('admin_eu');
  if (error || !ok) return telaEntrar('Esta conta não tem acesso ao painel.');
  await carregar();
}
function telaEntrar(msg) {
  $('#raiz').innerHTML = `<div class="entrar"><span class="eyebrow">Make3Lab</span><h1>Painel admin</h1>
    <p class="sub">Entre com a conta de administrador.</p>
    ${msg ? `<div class="aviso ruim" role="alert">${esc(msg)}</div>` : ''}
    <form id="f-entrar" class="cartao"><div><label for="e-mail">E-mail</label><input id="e-mail" type="email" autocomplete="email" required></div>
    <div style="margin-top:10px"><label for="e-senha">Senha</label><input id="e-senha" type="password" autocomplete="current-password" required></div>
    <div class="linha-bt"><button class="bt forte" type="submit">Entrar</button></div></form></div>`;
  $('#f-entrar').onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.auth.signInWithPassword({ email: $('#e-mail').value.trim(), password: $('#e-senha').value });
    if (error) return telaEntrar('E-mail ou senha não conferem.');
    iniciar();
  };
}
async function carregar(manterAberta) {
  const { data, error } = await sb.rpc('admin_painel');
  if (error) { $('#raiz').innerHTML = `<main><div class="aviso ruim">Não carregou: ${esc(error.message)}</div><button class="bt" onclick="location.reload()">Tentar de novo</button></main>`; return; }
  S.dados = data;
  if (!manterAberta) S.aberta = S.aberta && data.orgs.some((o) => o.id === S.aberta) ? S.aberta : null;
  desenhar();
}
const rpc = async (nome, args, ok) => {
  const { error } = await sb.rpc(nome, args);
  if (error) { toast('Não salvou: ' + error.message); return false; }
  if (ok) toast(ok); await carregar(true); return true;
};

/* ---------- derivados ---------- */
const emailsDaOrg = (o) => (o.membros || []).map((m) => String(m.email || '').toLowerCase());
const orgDoLead = (l) => S.dados.orgs.find((o) => o.lead_id === l.id) || S.dados.orgs.find((o) => emailsDaOrg(o).includes(String(l.email || '').toLowerCase()));
const leadDaOrg = (o) => S.dados.leads.find((l) => l.id === o.lead_id) || S.dados.leads.find((l) => emailsDaOrg(o).includes(String(l.email || '').toLowerCase()));
const founders = () => S.dados.orgs.filter((o) => o.plano === 'founder');
const chAtrasado = (c) => (c.status === 'aberto' || c.status === 'em_andamento') && horas(c.criado_em) > 24;
const chAberto = (c) => c.status === 'aberto' || c.status === 'em_andamento';
const proximasCalls = (dias) => S.dados.calls.filter((c) => c.agendada_para && (c.status === 'agendada' || c.status === 'a_agendar' || c.status === 'remarcar')
  && new Date(c.agendada_para) >= new Date(Date.now() - 2 * 3600e3) && new Date(c.agendada_para) <= new Date(Date.now() + dias * 864e5));
const erros24 = () => S.dados.erros.filter((e) => horas(e.criado_em) <= 24);

function desenhar() {
  const d = S.dados;
  const abas = [['geral', 'Visão geral'], ['leads', 'Leads', d.leads.filter((l) => l.status === 'novo').length],
    ['lojas', 'Lojas e Founders', founders().length], ['chamados', 'Chamados', d.chamados.filter(chAberto).length, d.chamados.some(chAtrasado)],
    ['agenda', 'Agenda de calls', proximasCalls(7).length], ['feedback', 'Feedback', d.feedbacks.filter((f) => f.status === 'novo').length],
    ['logs', 'Logs', erros24().length, erros24().length > 0]];
  $('#raiz').innerHTML = `<header class="topo"><b class="marca">Make3Lab</b><span class="sel">admin</span><div class="esp"></div>
    <span class="sub">${dth(d.agora)}</span><button class="bt mini" id="b-rec">Atualizar</button><button class="bt mini" id="b-sair">Sair</button></header>
    <nav class="abas" aria-label="Seções">${abas.map(([k, r, n, al]) => `<button data-aba="${k}" class="${S.aba === k ? 'on' : ''}" ${S.aba === k ? 'aria-current="page"' : ''}>${r}${n ? `<span class="cont ${al ? 'alerta' : ''}">${n}</span>` : ''}</button>`).join('')}</nav>
    <main id="corpo"></main><div id="modal"></div>`;
  $('#b-rec').onclick = () => carregar(true);
  $('#b-sair').onclick = async () => { await sb.auth.signOut(); telaEntrar(); };
  document.querySelectorAll('[data-aba]').forEach((b) => b.onclick = () => { S.aba = b.dataset.aba; desenhar(); });
  ({ geral, leads, lojas, chamados, agenda, feedback, logs })[S.aba]();
  if (S.aberta) fichaLoja(S.aberta);
}

/* ---------- visão geral ---------- */
function geral() {
  const d = S.dados, f = founders();
  const atras = d.chamados.filter(chAtrasado);
  const semConfig = f.filter((o) => PASSOS.some(([k]) => !(o.confirmados || {})[k]));
  const sem7 = f.filter((o) => !o.ultima_atividade || horas(o.ultima_atividade) > 7 * 24);
  $('#corpo').innerHTML = `<span class="eyebrow">Programa Founders</span><h1>Visão geral</h1><p class="sub">Vagas: ${f.length} de 10 preenchidas.</p>
    <div class="kpis">
      ${kpi('Leads novos', d.leads.filter((l) => l.status === 'novo').length, `${d.leads.length} no total · ${d.leads.filter((l) => l.quer_founder).length} querem Founder`, 'leads')}
      ${kpi('Founders ativos', f.length, 'de 10 vagas', 'lojas')}
      ${kpi('Chamados abertos', d.chamados.filter(chAberto).length, atras.length ? `${atras.length} passaram de 24 h` : 'nenhum atrasado', 'chamados', atras.length ? 'ruim' : '')}
      ${kpi('Calls em 7 dias', proximasCalls(7).length, `${d.calls.filter((c) => c.status === 'a_agendar' && c.tipo === 'entrada').length} entrada(s) a agendar`, 'agenda')}
      ${kpi('Feedback novo', d.feedbacks.filter((x) => x.status === 'novo').length, `${d.feedbacks.length} registrados`, 'feedback')}
      ${kpi('Erros em 24 h', erros24().length, 'do app dos clientes', 'logs', erros24().length ? 'at' : '')}
    </div>
    <div class="grid">
      <div class="cartao"><div class="cab"><h2>Precisa de você</h2></div>
        <ul class="lista">${[
          ...atras.map((c) => `<li class="item click" data-ch="${c.id}"><b>Chamado nº ${c.id} passou de 24 h</b><div class="sub">${esc(c.loja)} · ${esc(c.assunto)}</div></li>`),
          ...d.calls.filter((c) => c.tipo === 'entrada' && c.status === 'a_agendar').map((c) => `<li class="item click" data-org="${c.org_id}"><b>Agendar call de entrada</b><div class="sub">${esc(c.loja)}</div></li>`),
          ...semConfig.map((o) => `<li class="item click" data-org="${o.id}"><b>Configuração incompleta</b><div class="sub">${esc(o.nome)}: falta ${PASSOS.filter(([k]) => !(o.confirmados || {})[k]).map(([, r]) => r.toLowerCase()).join(', ')}</div></li>`),
          ...sem7.map((o) => `<li class="item click" data-org="${o.id}"><b>Sem uso há mais de 7 dias</b><div class="sub">${esc(o.nome)}${o.ultima_atividade ? ' · último sinal ' + dt(o.ultima_atividade) : ''}</div></li>`),
        ].join('') || '<li class="vazio">Nada pendente.</li>'}</ul></div>
      <div class="cartao"><div class="cab"><h2>Próximas calls</h2></div>${listaCalls(proximasCalls(14).slice(0, 8), true)}</div>
    </div>`;
  ligarCliques();
}

      <div><label for="cs-${c.id}">Status</label><select id="cs-${c.id}">${Object.entries(ST_CALL).map(([k, v]) => `<option value="${k}" ${c.status === k ? 'selected' : ''}>${v[0]}</option>`).join('')}</select></div>
      <div><label for="cd-${c.id}">Duração</label><select id="cd-${c.id}">${[15, 20, 30, 45].map((n) => `<option ${c.duracao_min === n ? 'selected' : ''} value="${n}">${n} min</option>`).join('')}</select></div></div>
    <div style="margin-top:8px"><label for="cn-${c.id}">Notas</label><textarea id="cn-${c.id}" rows="${c.notas ? 8 : 3}">${esc(c.notas)}</textarea></div>
    <div class="linha-bt"><button class="bt mini forte" data-call-salva="${c.id}">Salvar call</button><button class="bt mini" data-roteiro="${c.id}" data-tipo="${c.tipo}">Usar roteiro</button>
      ${lnk ? `<a class="bt mini" href="${lnk}" target="_blank" rel="noopener">Google Agenda</a>` : ''}</div></details>`;
}
function linkGoogle(c) {
  if (!c.agendada_para) return '';
  const i = new Date(c.agendada_para), f = new Date(i.getTime() + (c.duracao_min || 20) * 60e3);
  const z = (d) => d.toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(`Make3Lab · ${TIPO_CALL[c.tipo]} · ${c.loja}`)}&dates=${z(i)}/${z(f)}&details=${encodeURIComponent(ROTEIRO[c.tipo].split('\n')[0])}`;
}

  if (!xs.length) return '<div class="vazio">Nenhuma call nesse período.</div>';
  return `<ul class="lista">${xs.map((c) => `<li class="item click" data-org="${c.org_id}"><div class="l1"><div><b class="n">${c.agendada_para ? dth(c.agendada_para) : 'sem data'}</b> · ${TIPO_CALL[c.tipo]}${c.tipo === 'quinzenal' ? ' ' + c.ordem : ''}
    ${comLoja ? `<div class="sub">${esc(c.loja)} · ${c.duracao_min} min</div>` : ''}</div>${pil(ST_CALL, c.status)}</div></li>`).join('')}</ul>`;
}
function agenda() {
  const xs = S.dados.calls.filter((c) => !['feita', 'cancelada', 'faltou'].includes(c.status));
  const semData = xs.filter((c) => !c.agendada_para), comData = xs.filter((c) => c.agendada_para).sort((a, b) => new Date(a.agendada_para) - new Date(b.agendada_para));
  const porDia = {}; comData.forEach((c) => { const k = dt(c.agendada_para); (porDia[k] = porDia[k] || []).push(c); });
  const feitas = S.dados.calls.filter((c) => c.status === 'feita').length, total = S.dados.calls.length;
  $('#corpo').innerHTML = `<span class="eyebrow">Entrada, quinzenais até o mês 3 e mensais nos meses 4 e 5</span><h1>Agenda de calls</h1>
    <p class="sub"><span class="n">${feitas}</span> de <span class="n">${total}</span> feitas. As datas quinzenais e mensais nascem como sugestão às 10h: ajuste e marque como agendada.</p>
    <div class="linha-bt" style="margin:0 0 14px"><button class="bt" id="ics">Baixar agenda (.ics)</button></div>
    <div class="grid"><div class="cartao"><div class="cab"><h2>Sem data</h2><span class="sub">${semData.length}</span></div>${listaCalls(semData, true)}</div>
    <div class="cartao"><div class="cab"><h2>Com data</h2><span class="sub">${comData.length}</span></div>
      ${Object.keys(porDia).length ? Object.entries(porDia).map(([d, cs]) => `<h3>${d}</h3>${listaCalls(cs, true)}`).join('') : '<div class="vazio">Nada agendado.</div>'}</div></div>`;
  $('#ics').onclick = () => {
    const z = (d) => new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
    const ev = comData.map((c) => `BEGIN:VEVENT\r\nUID:m3call-${c.id}@make3lab.com.br\r\nDTSTAMP:${z(Date.now())}\r\nDTSTART:${z(c.agendada_para)}\r\nDTEND:${z(new Date(c.agendada_para).getTime() + c.duracao_min * 60e3)}\r\nSUMMARY:Make3Lab · ${TIPO_CALL[c.tipo]} · ${String(c.loja).replace(/[,;]/g, ' ')}\r\nEND:VEVENT`).join('\r\n');
    baixar('calls-founders.ics', `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Make3Lab//Admin//PT\r\n${ev}\r\nEND:VCALENDAR`, 'text/calendar');
  };
  ligarCliques($('#corpo'));
}

/* ---------- feedback ---------- */
function feedback() {
  const ft = S.filtro.fbT || 'todos', fs = S.filtro.fbS || 'abertos';
  const xs = S.dados.feedbacks.filter((f) => (ft === 'todos' || f.tipo === ft) && (fs === 'todos' || (fs === 'abertos' ? (f.status === 'novo' || f.status === 'backlog') : f.status === fs)));
  const ord = { alta: 0, media: 1, baixa: 2 }; xs.sort((a, b) => ord[a.prioridade] - ord[b.prioridade] || new Date(b.criado_em) - new Date(a.criado_em));
  const contagem = Object.keys(TIPO_FB).map((k) => [k, S.dados.feedbacks.filter((f) => f.tipo === k && f.status !== 'descartado').length]);
  $('#corpo').innerHTML = `<span class="eyebrow">De todas as calls e chamados</span><h1>Feedback</h1>
    <div class="chips" style="margin-bottom:12px">${contagem.map(([k, n]) => `<span class="pil"><span class="n">${n}</span> ${TIPO_FB[k]}</span>`).join('')}</div>
    <div class="filtros"><div><label for="fb-ft">Tipo</label><select id="fb-ft">${[['todos', 'Todos'], ...Object.entries(TIPO_FB)].map(([k, r]) => `<option value="${k}" ${ft === k ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
      <div><label for="fb-fs">Status</label><select id="fb-fs">${[['abertos', 'Novo e backlog'], ['todos', 'Todos'], ...Object.entries(ST_FB).map(([k, v]) => [k, v[0]])].map(([k, r]) => `<option value="${k}" ${fs === k ? 'selected' : ''}>${r}</option>`).join('')}</select></div>
      <div class="esp"></div><button class="bt" id="csv-f">Baixar CSV</button></div>
    ${xs.length ? `<ul class="lista">${xs.map(fbItem).join('')}</ul>` : '<div class="vazio">Nenhum feedback neste filtro. Registre na ficha do Founder, durante ou depois da call.</div>'}`;
  $('#fb-ft').onchange = (e) => { S.filtro.fbT = e.target.value; feedback(); };
  $('#fb-fs').onchange = (e) => { S.filtro.fbS = e.target.value; feedback(); };
  $('#csv-f').onclick = () => csv('feedback-founders', ['Loja', 'Tipo', 'Prioridade', 'Status', 'Texto', 'Data'], xs.map((f) => [f.loja, TIPO_FB[f.tipo], PRIO[f.prioridade][0], ST_FB[f.status][0], f.texto, dt(f.criado_em)]));
  ligarFb($('#corpo'));
}

/* ---------- logs ---------- */
function logs() {
  const xs = S.dados.erros;
  $('#corpo').innerHTML = `<span class="eyebrow">Erros que o app dos clientes registrou</span><h1>Logs</h1>
    <p class="sub">Falha ao salvar e erro de tela, com loja, usuário e largura da tela. Limite de 30 por usuário por hora.</p>
    ${xs.length ? `<ul class="lista">${xs.map((e) => `<li class="item"><div class="l1"><div><b class="n">${dth(e.criado_em)}</b> · ${esc(e.loja || 'sem loja')} · ${esc(e.email || '')}</div>
      <span class="sub">${esc(e.contexto?.largura ? e.contexto.largura + ' px' : '')}</span></div>
      <div class="pre mono" style="font-size:12.5px;margin-top:6px">${esc(e.mensagem)}</div>
      <details><summary>contexto</summary><div class="pre mono sub">${esc(JSON.stringify(e.contexto, null, 1))}</div></details></li>`).join('')}</ul>` : '<div class="vazio">Nenhum erro registrado.</div>'}`;
}

/* ---------- utilidades ---------- */
function baixar(nome, txt, tipo) { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([txt], { type: tipo })); a.download = nome; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
function csv(nome, cab, linhas) {
  const c = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
  baixar(`${nome}-${hojeYmd()}.csv`, '﻿' + [cab, ...linhas].map((l) => l.map(c).join(';')).join('\r\n'), 'text/csv;charset=utf-8');
}
iniciar();
</script>
</body>
</html>
