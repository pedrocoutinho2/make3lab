# Cópia de segurança do Make3Lab, sem o plano Pro do Supabase (23/10/2026).
# Todo dia às 03:17 (Brasília): dump do banco (public, plataforma, auth e storage), cifrado com senha.
# Domingo: também os arquivos do Storage (logos, personalizações, projetos 3MF), cifrados.
# Fica como artefato privado do repositório por 30 dias. Restaurar: ferramentas/backup/LEIA.md
#
# Segredos do repositório (Settings > Secrets and variables > Actions):
#   SUPABASE_DB_URL        URI do Session pooler (Supabase > Connect > Session pooler), com a senha do banco
#   SUPABASE_SERVICE_ROLE  chave service_role (Supabase > Project Settings > API), só para baixar o Storage
#   BACKUP_SENHA           senha longa para cifrar os arquivos; guardar fora do vault, no gerenciador de senhas
name: backup
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      storage:
        description: 'Baixar também os arquivos do Storage'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { sparse-checkout: ferramentas/backup }
      - name: Conferir segredos
        env: { DB: '${{ secrets.SUPABASE_DB_URL }}', SENHA: '${{ secrets.BACKUP_SENHA }}' }
        run: |
          [ -n "$DB" ] || { echo "::error::Falta o segredo SUPABASE_DB_URL"; exit 1; }
          [ -n "$SENHA" ] || { echo "::error::Falta o segredo BACKUP_SENHA"; exit 1; }
      - name: pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt noble-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump do banco
        env: { DB: '${{ secrets.SUPABASE_DB_URL }}', SENHA: '${{ secrets.BACKUP_SENHA }}' }
        run: |
          set -euo pipefail
          D=$(date -u +%Y-%m-%d)
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --format=custom --no-owner --no-privileges \
            -n public -n plataforma -n auth -n storage -f banco.dump
          /usr/lib/postgresql/17/bin/pg_restore --list banco.dump | grep -c "TABLE DATA" | xargs echo "tabelas com dados:"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$SENHA" --symmetric --cipher-algo AES256 -o "make3lab-banco-$D.dump.gpg" banco.dump
          rm banco.dump
          ls -lh make3lab-banco-*.gpg
      - name: Arquivos do Storage (domingo ou pedido)
        if: ${{ github.event_name == 'schedule' || inputs.storage }}
        env: { SRK: '${{ secrets.SUPABASE_SERVICE_ROLE }}', SENHA: '${{ secrets.BACKUP_SENHA }}', MANUAL: '${{ inputs.storage }}' }
        run: |
          set -euo pipefail
          if [ "$MANUAL" != "true" ] && [ "$(date -u +%u)" != "7" ]; then echo "não é domingo, pulando"; exit 0; fi
          [ -n "$SRK" ] || { echo "::warning::Sem SUPABASE_SERVICE_ROLE, Storage fora desta cópia"; exit 0; }
          cd ferramentas/backup && npm install --silent --no-save @supabase/supabase-js@2 && node baixar-storage.mjs ../../storage
          cd ../.. && tar -czf storage.tgz storage
          gpg --batch --yes --pinentry-mode loopback --passphrase "$SENHA" --symmetric --cipher-algo AES256 -o "make3lab-storage-$(date -u +%Y-%m-%d).tgz.gpg" storage.tgz
          rm -rf storage storage.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: make3lab-*.gpg
          retention-days: 30
          if-no-files-found: error
